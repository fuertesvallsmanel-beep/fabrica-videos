<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Brico';src:url(../motor/fonts/BricolageGrotesque.ttf)}
html,body{margin:0;overflow:hidden;font-family:'Brico',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(1300px 900px at 35% 40%,#2B3FE6 0%,#1724B0 50%,#0C1170 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(150,168,255,.08) 3px,transparent 3px),linear-gradient(90deg,rgba(150,168,255,.08) 3px,transparent 3px);background-size:80px 80px}
.FD{font-weight:800;font-stretch:76%;letter-spacing:-2px}
</style><script src="../motor/organs.js"></script><script src="../motor/tito.js"></script></head><body><div id="root"></div><script>
const R=document.getElementById('root');
function face(size, mood){ // cara del Tito dins d'un cercle
  const d=document.createElement('div'); d.style.cssText=`position:absolute;inset:0;overflow:hidden;border-radius:50%`;
  const s=size*2.13; d.innerHTML=`<div style="position:absolute;left:${size/2-0.5025*s}px;top:${size/2-0.29*s*1.5}px">${Tito.svg(s)}</div>`;
  return d;
}
window.make = (kind) => {
  R.innerHTML='';
  if(kind.startsWith('avatar')){ document.body.style.cssText='width:800px;height:800px';
    // el Tito mentre l'escàner el travessa: a dalt de la línia es veu el cervell, a sota la cara (el «modo escáner» és la marca)
    const L=v=>`<div class="tt" style="position:absolute;left:${338-600*.5025}px;top:40px">${Tito.svg(600,{organ:'cerebro'})}</div>`;
    const Y=kind==='avatarB'?300:318;
    R.innerHTML=`<div class="bg"></div><div style="position:absolute;left:30px;top:30px;width:740px;height:740px;border-radius:50%;background:#FFD60A"></div>
      <div style="position:absolute;left:62px;top:62px;width:676px;height:676px;border-radius:50%;background:#2B3FE6;overflow:hidden"><div class="grid"></div>
        <div id="a">${L()}</div><div id="b" style="position:absolute;inset:0;clip-path:inset(0 0 ${676-Y}px 0)"><div style="position:absolute;inset:0;background:#0C1170"></div>${L()}</div>
        <div style="position:absolute;left:0;right:0;top:${Y-6}px;height:12px;background:#3EF0FF;box-shadow:0 0 30px 10px rgba(62,240,255,.7)"></div></div>`;
    const sv=R.querySelectorAll('svg.tito'); Tito.render(sv[0],1.2,0,'happy',{}); Tito.render(sv[1],1.2,0,'happy',{scan:1});
  }
  if(kind==='watermark'){ document.body.style.cssText='width:300px;height:300px;background:transparent';
    R.innerHTML=`<div style="position:absolute;inset:6px;border-radius:50%;background:#2B3FE6;border:12px solid #fff;box-sizing:border-box;overflow:hidden"><div id="f" style="position:absolute;left:${132-300*.5025}px;top:-24px"></div></div>`;
    const f=document.getElementById('f'); f.innerHTML=Tito.svg(300); Tito.render(f.firstChild,1.2,0,"happy",{});
  }
  if(kind==='banner'){ document.body.style.cssText='width:2560px;height:1440px';
    const deco=(x,y,s,svg)=>`<div style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:.9">${svg}</div>`;
    const OA=window.OrganArt;
    R.innerHTML=`<div class="bg"></div><div class="grid"></div>
    ${deco(120,560,300,OA.svg('corazon',300,300))}${deco(2140,560,300,OA.svg('pulmones',300,300))}${deco(330,600,220,OA.svg('estomago',220,220))}${deco(1990,600,200,OA.svg('rinon',200,200))}
    <div style="position:absolute;left:507px;top:508px;width:1546px;height:423px;overflow:hidden">
      <div style="position:absolute;left:40px;top:40px;width:360px;height:360px;border-radius:50%;background:#FFD60A"></div>
      <div style="position:absolute;left:58px;top:58px;width:324px;height:324px;border-radius:50%;background:#3B5BFF"></div>
      <div id="t" style="position:absolute;left:${220-330*.5025}px;top:10px;width:330px;height:413px;overflow:hidden"></div>
      <div style="position:absolute;left:470px;top:70px">
        <div class="FD" style="color:#fff;font-size:150px;line-height:.95;text-shadow:8px 8px 0 #0A1A8C">Cuerpo al <span style="color:#FFD60A">Límite</span></div>
        <div style="color:#D3DAFF;font-size:36px;font-weight:700;margin-top:18px;white-space:nowrap">Cada semana, Tito se presta a un experimento extremo</div>
        <div style="display:inline-block;margin-top:22px;padding:12px 30px 16px;border-radius:999px;background:#FF3B6B;color:#fff;font-size:38px;font-weight:800">Nuevo experimento martes y viernes</div>
      </div></div>`;
    const t=document.getElementById('t'); const Y2=150;
    t.innerHTML=`<div>${Tito.svg(330,{organ:'cerebro'})}</div><div style="position:absolute;inset:0;clip-path:inset(0 0 ${413-Y2}px 0)">${Tito.svg(330,{organ:'cerebro'})}</div><div style="position:absolute;left:-10px;width:350px;top:${Y2-5}px;height:10px;border-radius:5px;background:#3EF0FF;box-shadow:0 0 24px 8px rgba(62,240,255,.7)"></div>`;
    t.style.overflow='visible'; const sv=t.querySelectorAll('svg.tito'); Tito.render(sv[0],1.2,0,'happy',{}); Tito.render(sv[1],1.2,0,'happy',{scan:1});
  }
};
</script></body></html>
