<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Brico';src:url(fonts/BricolageGrotesque.ttf);font-weight:200 800;font-stretch:75% 100%}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:'Brico',sans-serif;color:#fff;background:radial-gradient(1000px 700px at 30% 45%,#2B3FE6 0%,#1724B0 55%,#0C1170 100%)}
#grain{position:absolute;inset:0;background:url(grain.png);mix-blend-mode:overlay;opacity:.12}
#disc{position:absolute;border-radius:50%}
#who{position:absolute}
#t{position:absolute;left:610px;top:60px;width:650px}
.big{font-weight:800;font-stretch:76%;letter-spacing:-2px;line-height:.9;text-shadow:9px 9px 0 rgba(7,11,69,.45)}
.tag{display:inline-block;margin-top:22px;padding:8px 24px;border-radius:14px;font-weight:800;font-size:46px;box-shadow:7px 7px 0 rgba(7,11,69,.45)}
.exp{display:inline-block;padding:4px 18px;border-radius:10px;background:#fff;color:#0B0F4A;font-weight:800;font-stretch:76%;font-size:64px;transform:rotate(-3deg);margin-bottom:14px;box-shadow:6px 6px 0 rgba(7,11,69,.45)}
</style></head><body>
<div id="disc"></div><div id="who"></div><div id="t"></div><div id="grain"></div>
<script src="tito.js"></script>
<script>
// window.THUMB = {num, l1, l1acc, l2, tag, acc, s1, s2, person:{fatigue, mood, scan}}
function make(T){
  const acc = T.acc || '#FF3B6B';
  const p = T.person || {fatigue: .9, mood: 'tired'};
  const d = document.getElementById('disc'); d.style.display='none';
  const w = document.getElementById('who'); w.style.cssText += ';left:-150px;top:-40px;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff)'; w.innerHTML = Tito.svg(880, {organ: p.scan || 'corazon'});
  Tito.render(w.firstChild, 1.0, p.fatigue ?? .9, p.mood || 'tired', {scan: p.scan ? 1 : 0, sweat: (p.fatigue ?? .9) > .5});
  document.getElementById('t').innerHTML = (T.num ? `<div class="exp">Experimento ${T.num}</div>` : '') +
    `<div class="big" style="font-size:${T.s1 || 230}px;color:#FFD60A"><span>${T.l1acc || ''}</span>${T.l1 || ''}</div>` +
    `<div class="big" style="font-size:${T.s2 || 130}px;margin-top:8px">${T.l2 || ''}</div>` +
    (T.tag ? `<div class="tag" style="background:${acc}">${T.tag}</div>` : '');
}
</script></body></html>
