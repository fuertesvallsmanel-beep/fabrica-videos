<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#060914;font-family:'Inter Display','Inter',sans-serif;}
  #world{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
  #bg{position:absolute;inset:0;background:radial-gradient(1200px 800px at 35% 55%,#16123a 0%,#0a0d22 55%,#05070f 100%);}
  canvas,#stage,#vig{position:absolute;inset:0}
  #vig{background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);pointer-events:none}
  #hud{position:absolute;left:160px;top:40px;width:1600px;height:110px;opacity:0}
  #src{position:absolute;left:70px;bottom:40px;color:#64748B;font-size:22px;font-weight:500}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none}
  .scene{position:absolute;inset:0;transform-origin:50% 50%}
  #vbg,#cv2,#vtop,#vcap,#vchar{display:none}
  /* ---- mode vertical (Shorts 1080x1920) ---- */
  body.vert{width:1080px;height:1920px}
  body.vert #vbg{display:block;position:absolute;inset:0;background:radial-gradient(900px 1200px at 50% 45%,#1d1650 0%,#0a0d22 60%,#04050c 100%)}
  body.vert #cv2{display:block;position:absolute;inset:0}
  body.vert #world{transform:translate(0,590px) scale(.5625);border-top:3px solid #818CF855;border-bottom:3px solid #818CF855}
  body.vert #vtop{display:flex;position:absolute;left:60px;right:60px;top:150px;height:360px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  body.vert #vcap{display:flex;position:absolute;left:50px;right:50px;top:1230px;height:260px;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:70px;font-weight:900;line-height:1.15;letter-spacing:-1px}
  body.vert #vchar{display:block;position:absolute;left:390px;top:1500px;width:300px;height:450px}
  body.vert #fade{width:1080px;height:1920px}
</style></head>
<body>
<div id="vbg"></div><canvas id="cv2" width="1080" height="1920"></canvas>
<div id="world"><div id="bg"></div><canvas id="cv" width="1920" height="1080"></canvas>
<div id="stage"></div><div id="hud"></div><div id="src"></div><div id="vig"></div></div>
<div id="vtop"></div><div id="vcap"></div><div id="vchar"></div>
<div id="fade"></div>
<script src="lib.js"></script>
</body></html>
