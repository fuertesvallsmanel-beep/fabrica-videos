<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Brico';src:url(fonts/BricolageGrotesque.ttf);font-weight:200 800;font-stretch:75% 100%}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0C1170;font-family:'Brico',sans-serif;color:#fff}
  #world{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
  #bg{position:absolute;inset:0;background:radial-gradient(1400px 950px at 38% 42%,#2B3FE6 0%,#1724B0 52%,#0C1170 100%)}
  canvas,#stage,#vig{position:absolute;inset:0}
  #vig{background:radial-gradient(ellipse at center,transparent 62%,rgba(7,11,69,.45) 100%);pointer-events:none}
  #grainw{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:overlay;opacity:.2}
  #grain{position:absolute;left:0;top:0;width:2100px;height:2100px;background:url(grain.png)}
  #hud{position:absolute;left:160px;top:42px;width:1600px;height:140px;opacity:0}
  #src{position:absolute;left:70px;bottom:36px;color:#C7D0FF;font-size:22px;font-weight:600;opacity:.9}
  #fade{position:absolute;inset:0;background:#070B45;pointer-events:none}
  .scene{position:absolute;inset:0;transform-origin:50% 50%}
  #vbg,#cv2,#vtop,#vcap,#vchar{display:none}
  /* ---- mode vertical (Shorts 1080x1920) ---- */
  body.vert{width:1080px;height:1920px}
  body.vert #vbg{display:block;position:absolute;inset:0;background:radial-gradient(1000px 1300px at 50% 42%,#2B3FE6 0%,#1724B0 55%,#0C1170 100%)}
  body.vert #cv2{display:block;position:absolute;inset:0}
  body.vert #world{transform:translate(-75px,400px) scale(.64);box-shadow:none}
  body.vert #vtop{display:flex;position:absolute;left:60px;right:60px;top:90px;height:300px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  body.vert #vcap{display:flex;position:absolute;left:50px;right:50px;top:1150px;height:280px;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:82px;font-weight:800;font-stretch:80%;line-height:1.12;text-shadow:5px 5px 0 rgba(7,11,69,.5)}
  body.vert #vchar{display:block;position:absolute;left:390px;top:1455px;width:300px;height:450px}
  body.vert #fade{width:1080px;height:1920px}
  body.vert #grainw{width:1080px;height:1920px}
</style></head>
<body>
<div id="vbg"></div><canvas id="cv2" width="1080" height="1920"></canvas>
<div id="world"><div id="bg"></div><canvas id="cv" width="1920" height="1080"></canvas>
<div id="stage"></div><div id="hud"></div><div id="src"></div><div id="vig"></div></div>
<div id="vtop"></div><div id="vcap"></div><div id="vchar"></div>
<div id="grainw"><div id="grain"></div></div>
<div id="fade"></div>
<script src="tito.js"></script>
<script src="lib.js"></script>
</body></html>
