<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#060914;font-family:'Inter Display','Inter',sans-serif;}
  #bg{position:absolute;inset:0;background:radial-gradient(1200px 800px at 35% 55%,#16123a 0%,#0a0d22 55%,#05070f 100%);}
  canvas,#stage,#vig{position:absolute;inset:0}
  #vig{background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);pointer-events:none}
  #hud{position:absolute;left:160px;top:40px;width:1600px;height:110px;opacity:0}
  #src{position:absolute;right:70px;bottom:40px;color:#64748B;font-size:22px;font-weight:500}
  #fade{position:absolute;inset:0;background:#000;pointer-events:none}
  .scene{position:absolute;inset:0;transform-origin:50% 50%}
</style></head>
<body>
<div id="bg"></div><canvas id="cv" width="1920" height="1080"></canvas>
<div id="stage"></div><div id="hud"></div><div id="src"></div><div id="vig"></div><div id="fade"></div>
<script src="lib.js"></script>
</body></html>
